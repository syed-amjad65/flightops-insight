name: Bug report
description: Report a reproducible problem with the prototype.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please do not attach proprietary airline data,
        credentials or personal information.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the actual behaviour and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command, page or script, and the smallest input that shows the problem.
      placeholder: |
        1. Run `python scripts/...`
        2. Open the app at ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      description: Paste the error output. Remove secrets and local paths if needed.
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - OTP model / features
        - RUL model / features
        - Maintenance optimizer
        - Streamlit app
        - Live flight tracking
        - Data build / contracts
        - Docs / deployment
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have read `docs/limitations.md`.
          required: true
        - label: I have removed credentials and proprietary data from this report.
          required: true
