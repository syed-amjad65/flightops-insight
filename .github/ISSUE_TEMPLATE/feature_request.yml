name: Feature request
description: Suggest an improvement or a new capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What decision or workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behaviour you would like, including which module or page it affects.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - OTP model / features
        - RUL model / features
        - Maintenance optimizer
        - Streamlit app
        - Live flight tracking
        - Data build / contracts
        - Docs / deployment
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Scope check
      options:
        - label: This request uses public or synthetic data only.
          required: true
        - label: This request keeps a human in the loop for operational decisions.
          required: true
