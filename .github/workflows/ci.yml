name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pandas>=2.2,<4" \
            "numpy>=1.26,<3" \
            "pyyaml>=6.0,<7" \
            "requests>=2.32,<3" \
            "ortools>=9.11,<10" \
            "duckdb>=1.1,<3" \
            "joblib>=1.4,<2" \
            "pytest>=8,<10"

      - name: Run unit tests
        run: python -m pytest
