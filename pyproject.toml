[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flightops-insight"
version = "0.1.0"
description = "Decision-support prototype for airline Flight Ops and CAMO"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<4",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "xgboost>=2.1,<4",
  "lightgbm>=4.5,<5",
  "duckdb>=1.1,<3",
  "ortools>=9.11,<10",
  "torch>=2.4,<3",
  "shap>=0.46,<1",
  "pyarrow>=17",
  "pyyaml>=6.0",
  "joblib>=1.4",
  "plotly>=5.24",
  "streamlit>=1.39",
  "requests>=2.32,<3",
  "Authlib>=1.3.2,<2",
]

[project.scripts]
flightops-train-otp = "flightops.cli:train_otp"
flightops-train-rul = "flightops.cli:train_rul"
flightops-run-optimization = "flightops.cli:run_optimization"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
